name: Deploy to Windows VM via Self-Hosted Runner (Non-Admin)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Deploy Dist to User Web Directory
        run: |
          $targetDir = "$HOME\pivotal-erp-web"
          if (!(Test-Path $targetDir)) {
            New-Item -ItemType Directory -Path $targetDir -Force
          }
          Copy-Item -Path "dist\*" -Destination $targetDir -Recurse -Force
        shell: powershell

      - name: Ensure Web Server is Running on Port 8081
        run: |
          $port = 8081
          $targetDir = "$HOME\pivotal-erp-web"
          $conn = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
          if (-not $conn) {
            Write-Host "Port $port is not listening. Launching background server..."
            Start-Process powershell -WindowStyle Hidden -ArgumentList "-Command", "npx --yes serve -s '$targetDir' -l $port"
            Start-Sleep -Seconds 3
          } else {
            Write-Host "Port $port is active and serving updated static files from $targetDir."
          }
        shell: powershell
